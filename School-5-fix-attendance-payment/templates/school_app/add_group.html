{% extends 'base.html' %}

{% block title %}إنشاء فوج جديد{% endblock %}

{% block page_title %}إنشاء فوج جديد{% endblock %}

{% block content %}
<div class="card">
  <div class="card-header">
    <h2 class="card-title">معلومات الفوج</h2>
  </div>
  <div class="card-body">
    <form id="group-form" method="POST" action="{% url 'add_group' %}">
      {% csrf_token %}
      <div class="form-group">
        <label for="group-name">اسم الفوج</label>
        <input type="text" id="group-name" name="name" class="form-control" required>
      </div>
      
      <div class="form-group">
        <label for="subject">المادة</label>
        <select id="subject" name="subject" class="form-control subject-dropdown subject-dropdown-for-teacher" required>
          <option value="">اختر المادة</option>
          <!-- Will be populated dynamically -->
        </select>
      </div>
      
      <div class="form-group">
        <label for="teacher">المدرس</label>
        <select id="teacher" name="teacher" class="form-control teacher-dropdown" required>
          <option value="">اختر المدرس</option>
          <!-- Will be populated based on selected subject -->
        </select>
      </div>
      
      <div class="form-group">
        <label for="academic-levels">المستويات الدراسية المتوافقة</label>
        <select id="academic-levels" name="academic_levels" class="form-control academic-level-dropdown" multiple required>
          <!-- Will be populated dynamically -->
        </select>
        <small class="form-text text-muted">اضغط Ctrl (أو Cmd على Mac) لاختيار أكثر من مستوى.</small>
      </div>
      
      <div class="form-group">
        <label for="price">السعر لكل 4 حصص (بالدينار)</label>
        <input type="number" id="price" name="price_per_4_sessions" class="form-control" min="0" step="0.01" required>
      </div>
      
      <div class="form-group">
        <label for="session-day">يوم الحصة الأسبوعية</label>
        <select id="session-day" name="session_day" class="form-control" required>
          <option value="">اختر اليوم</option>
          <option value="0">الاثنين</option>
          <option value="1">الثلاثاء</option>
          <option value="2">الأربعاء</option>
          <option value="3">الخميس</option>
          <option value="4">الجمعة</option>
          <option value="5">السبت</option>
          <option value="6">الأحد</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="start-time">وقت بداية الحصة</label>
        <input type="time" id="start-time" name="start_time" class="form-control" required>
      </div>
      
      <div class="form-group">
        <label for="duration">مدة الحصة (بالساعات)</label>
        <input type="number" id="duration" name="duration" class="form-control" min="0.5" max="3" step="0.5" value="1.5" required>
      </div>

      <div class="form-group">
        <div class="custom-control custom-checkbox">
          <input type="checkbox" class="custom-control-input" id="is_continuous" name="is_continuous">
          <label class="custom-control-label" for="is_continuous">فوج مستمر (تُنشأ الحصص أسبوعياً تلقائياً)</label>
        </div>
      </div>
      
      <div class="card-footer text-right">
        <a href="{% url 'group_list' %}" class="btn btn-secondary">إلغاء</a>
        <button type="submit" id="create-group-btn" class="btn btn-primary">إنشاء الفوج</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
